name: Release public order numbers migrations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Dry-run is the default; apply requires production approval
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

# Manual-only. This file must be merged to main before it can receive the
# protected production environment and its database secret.
permissions:
  contents: read

concurrency:
  group: supabase-production-public-order-numbers
  cancel-in-progress: false

env:
  SOURCE_SHA: 63ad02a09fe6c3f203e4e553f22adfab1e281fff
  TARGET_MIGRATIONS: |-
    20261119140000_public_order_numbers.sql
    20261119150000_public_order_number_projections.sql
    20261119160000_public_order_number_payout_projections.sql

jobs:
  release:
    name: Public order numbers ${{ inputs.operation }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
    steps:
      - name: Check out the reviewed PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify reviewed source commit
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          while IFS= read -r migration; do
            test -f "supabase/migrations/$migration"
          done <<< "$TARGET_MIGRATIONS"

      - name: Download pinned Supabase CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          tools="$RUNNER_TEMP/public-order-numbers-release-tools"
          mkdir -p "$tools"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$tools/supabase.tar.gz" \
            "https://github.com/supabase/cli/releases/download/v3.1.0/supabase_3.1.0_linux_amd64.tar.gz"
          echo "dbe9fd66771337fc198727da86b9d3551302f87a7091cd8781be2a4cd0c8ac4d  $tools/supabase.tar.gz" | sha256sum --check --status
          tar -xzf "$tools/supabase.tar.gz" -C "$tools"
          install -m 0755 "$tools/supabase" "$tools/supabase-bin"
          echo "$tools" >> "$GITHUB_PATH"
          "$tools/supabase-bin" --version

      - name: Guard migration history, dry-run, and optional apply
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -Eeuo pipefail
          test -n "$SUPABASE_DB_URL"
          command -v psql >/dev/null

          local_files="$RUNNER_TEMP/public-order-numbers-local-files.txt"
          local_versions="$RUNNER_TEMP/public-order-numbers-local-versions.txt"
          remote_versions="$RUNNER_TEMP/public-order-numbers-remote-versions.txt"
          unexpected_remote="$RUNNER_TEMP/public-order-numbers-unexpected-remote.txt"
          pending_files="$RUNNER_TEMP/public-order-numbers-pending-files.txt"
          expected_files="$RUNNER_TEMP/public-order-numbers-expected-files.txt"
          dry_run_log="$RUNNER_TEMP/public-order-numbers-dry-run.log"
          dry_run_files="$RUNNER_TEMP/public-order-numbers-dry-run-files.txt"
          applied_versions="$RUNNER_TEMP/public-order-numbers-applied-versions.txt"
          expected_versions="$RUNNER_TEMP/public-order-numbers-expected-versions.txt"
          compatibility_checks="$RUNNER_TEMP/public-order-numbers-compatibility-checks.txt"
          expected_compatibility_checks="$RUNNER_TEMP/public-order-numbers-expected-compatibility-checks.txt"

          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort >"$local_files"
          sed -E 's/^([0-9]+)_.*/\1/' "$local_files" | sort -u >"$local_versions"
          printf '%s\n' "$TARGET_MIGRATIONS" >"$expected_files"

          compare_sorted_sets() {
            local expected="$1"
            local actual="$2"
            local label="$3"
            local expected_sorted="${expected}.sorted"
            local actual_sorted="${actual}.sorted"

            LC_ALL=C sort "$expected" >"$expected_sorted"
            LC_ALL=C sort "$actual" >"$actual_sorted"
            if [[ -n "$(uniq -d "$expected_sorted")" || -n "$(uniq -d "$actual_sorted")" ]]; then
              echo "::error::Release stopped: duplicate entries found while checking $label."
              exit 1
            fi
            if ! diff -u "$expected_sorted" "$actual_sorted"; then
              echo "::error::Release stopped: $label is missing or contains unexpected entries."
              exit 1
            fi
          }

          refresh_history() {
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc \
              'select version from supabase_migrations.schema_migrations order by version' \
              | sort -u >"$remote_versions"
            comm -13 "$local_versions" "$remote_versions" >"$unexpected_remote"
            if [[ -s "$unexpected_remote" ]]; then
              echo '::error::Release stopped: production migration history does not match the reviewed source.'
              exit 1
            fi
            : >"$pending_files"
            while IFS= read -r migration; do
              version="${migration%%_*}"
              if ! grep -Fxq "$version" "$remote_versions"; then
                printf '%s\n' "$migration" >>"$pending_files"
              fi
            done <"$local_files"
            if ! diff -u "$expected_files" "$pending_files"; then
              echo '::error::Release stopped: pending migrations must be exactly the three reviewed public-order-number files, in order.'
              exit 1
            fi
          }

          run_and_verify_dry_run() {
            echo 'Running Supabase dry-run; no production write is performed.'
            supabase-bin db push --db-url "$SUPABASE_DB_URL" --dry-run 2>&1 | tee "$dry_run_log"
            grep -Eo '[0-9]{14}_[A-Za-z0-9_]+\.sql' "$dry_run_log" | sort -u >"$dry_run_files" || true
            if ! diff -u <(sort "$expected_files") "$dry_run_files"; then
              echo '::error::Release stopped: dry-run output must show only the three approved public-order-number migrations.'
              exit 1
            fi
          }

          verify_applied_versions_and_compatibility() {
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc \
              "select version from supabase_migrations.schema_migrations where version in ('20261119140000','20261119150000','20261119160000') order by version" \
              >"$applied_versions"
            printf '20261119140000\n20261119150000\n20261119160000\n' >"$expected_versions"
            compare_sorted_sets "$expected_versions" "$applied_versions" 'applied migration versions'

            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "
              with checks(name, ok) as (
                values
                  ('orders.public_order_number', exists(select 1 from information_schema.columns where table_schema='public' and table_name='orders' and column_name='public_order_number' and is_nullable='NO')),
                  ('orders_assign_public_order_number trigger', exists(select 1 from pg_trigger where tgrelid='public.orders'::regclass and tgname='orders_assign_public_order_number' and tgenabled='O')),
                  ('place_order RPC', coalesce(to_regprocedure('public.place_order(uuid,jsonb,uuid,uuid,text)') is not null, false)),
                  ('admin_orders RPC', coalesce(to_regprocedure('public.admin_orders(text,text,text,text,integer)') is not null, false)),
                  ('vendor production orders RPC', coalesce(to_regprocedure('public.list_vendor_production_orders(text,timestamptz,text)') is not null, false))
              )
              select name from checks where ok order by name" >"$compatibility_checks"
            printf 'admin_orders RPC\norders.public_order_number\norders_assign_public_order_number trigger\nplace_order RPC\nvendor production orders RPC\n' >"$expected_compatibility_checks"
            compare_sorted_sets "$expected_compatibility_checks" "$compatibility_checks" 'checkout/RPC compatibility contract'
            echo 'Verified migration history and checkout/RPC compatibility contract without creating production orders.'
          }

          refresh_history
          run_and_verify_dry_run
          echo 'Dry-run verified the three approved migrations.'

          if [[ "${{ inputs.operation }}" == 'dry-run' ]]; then
            echo 'Dry-run complete; apply was not requested.'
            exit 0
          fi

          echo 'Apply requested after production environment approval. Re-checking history and dry-run.'
          refresh_history
          run_and_verify_dry_run
          supabase-bin db push --db-url "$SUPABASE_DB_URL" --yes
          verify_applied_versions_and_compatibility
