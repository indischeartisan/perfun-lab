name: Supabase Database Backup

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Verify pinned tools and required db dump flags without any Production credentials
        required: false
        default: true
        type: boolean
      fixture_restore_failure_test:
        description: Run the no-credential fixture test that intentionally fails after uploading an encrypted artifact
        required: false
        default: false
        type: boolean

# The workflow does not check out repository code, create commits, or call GitHub APIs.
# Artifact upload uses the runner's artifact runtime token, not GITHUB_TOKEN.
permissions: {}

concurrency:
  group: supabase-production-manual-backup
  cancel-in-progress: false

jobs:
  tooling-smoke-test:
    name: Verify backup tooling without credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download pinned tools and verify required dump flags
        shell: bash
        run: |
          set -Eeuo pipefail
          tools="$RUNNER_TEMP/perfun-backup-tooling-smoke-test"
          trap 'rm -rf -- "$tools"' EXIT
          mkdir -p "$tools/path"

          curl --fail --silent --show-error --location --retry 3 \
            --output "$tools/supabase.tar.gz" \
            "https://github.com/supabase/cli/releases/download/v3.1.0/supabase_3.1.0_linux_amd64.tar.gz"
          echo "dbe9fd66771337fc198727da86b9d3551302f87a7091cd8781be2a4cd0c8ac4d  $tools/supabase.tar.gz" | sha256sum --check --status
          tar -xzf "$tools/supabase.tar.gz" -C "$tools"
          install -m 0755 "$tools/supabase" "$tools/path/supabase"

          curl --fail --silent --show-error --location --retry 3 \
            --output "$tools/age.tar.gz" \
            "https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz"
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  $tools/age.tar.gz" | sha256sum --check --status
          tar -xzf "$tools/age.tar.gz" -C "$tools"
          install -m 0755 "$tools/age/age" "$tools/path/age"

          "$tools/path/supabase" db dump --help > "$tools/db-dump-help.txt"
          for flag in --remote --role-only --data-only --schema --use-copy --file; do
            grep -Fq -- "$flag" "$tools/db-dump-help.txt" || { echo "::error::Supabase CLI lacks required db dump flag: $flag"; exit 1; }
          done
          "$tools/path/age" --version >/dev/null
          echo "Pinned tools and required db dump flags verified without credentials."

  fixture-artifact-before-restore:
    name: Prove encrypted fixture artifact survives a failed restore
    needs: tooling-smoke-test
    if: inputs.fixture_restore_failure_test == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Create encrypted dummy fixture without credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          tools="$RUNNER_TEMP/perfun-fixture-tools"
          fixture_dir="$RUNNER_TEMP/perfun-backup-fixture"
          archive="$RUNNER_TEMP/perfun-backup-fixture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz.age"
          trap 'rm -rf -- "$tools" "$fixture_dir"' EXIT
          mkdir -p "$tools" "$fixture_dir"

          curl --fail --silent --show-error --location --retry 3 \
            --output "$tools/age.tar.gz" \
            "https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz"
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  $tools/age.tar.gz" | sha256sum --check --status
          tar -xzf "$tools/age.tar.gz" -C "$tools"

          printf '%s\n' 'fixture-only-not-production-data' > "$fixture_dir/fixture.sql"
          "$tools/age/age-keygen" -o "$fixture_dir/test-age-identity.txt" >/dev/null
          recipient="$("$tools/age/age-keygen" -y "$fixture_dir/test-age-identity.txt")"
          tar -C "$fixture_dir" -czf - fixture.sql | "$tools/age/age" --encrypt --recipient "$recipient" --output "$archive"
          test -s "$archive"
          echo "FIXTURE_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "Encrypted dummy fixture created without Production credentials."

      - name: Upload encrypted fixture artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perfun-backup-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FIXTURE_ARCHIVE }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Intentionally fail fixture restore after upload
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::error::Fixture restore intentionally failed after encrypted artifact upload."
          exit 1

      - name: Remove local fixture material
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- "$RUNNER_TEMP/perfun-backup-fixture" "$RUNNER_TEMP/perfun-fixture-tools"
          find "$RUNNER_TEMP" -maxdepth 1 -type f -name 'perfun-backup-fixture-*.tar.gz.age' -delete

  verify-fixture-artifact-after-failure:
    name: Verify encrypted fixture artifact is available after restore failure
    needs: fixture-artifact-before-restore
    if: always() && inputs.fixture_restore_failure_test == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download encrypted fixture artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: perfun-backup-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/perfun-fixture-artifact-check

      - name: Verify ciphertext is present without reading fixture contents
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_dir="$RUNNER_TEMP/perfun-fixture-artifact-check"
          archive="$(find "$artifact_dir" -maxdepth 1 -type f -name '*.tar.gz.age' -print -quit)"
          test -n "$archive"
          test -s "$archive"
          head -n 1 "$archive" | grep -Fxq 'age-encryption.org/v1'
          echo "Encrypted fixture artifact remains available after the intentional restore failure."

      - name: Remove downloaded ciphertext
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/perfun-fixture-artifact-check"

  validate-dummy-restore-and-privilege-fixture:
    name: Validate dummy restore and SQLSTATE 42501 locally
    needs: tooling-smoke-test
    if: inputs.fixture_restore_failure_test == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Restore a dummy dump and reproduce local privilege denial
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          tools="$RUNNER_TEMP/perfun-dummy-fixture-tools"
          dump_dir="$RUNNER_TEMP/perfun-dummy-fixture-dump"
          restore_dir="$RUNNER_TEMP/perfun-dummy-fixture-restore"
          privilege_log="$RUNNER_TEMP/perfun-dummy-fixture-privilege.log"
          start_log="$RUNNER_TEMP/perfun-dummy-fixture-start.log"
          cleanup() {
            (cd "$restore_dir" && "$tools/supabase" stop --no-backup) >/dev/null 2>&1 || true
            rm -rf -- "$tools" "$dump_dir" "$restore_dir" "$privilege_log" "$start_log"
          }
          trap cleanup EXIT
          mkdir -p "$tools" "$dump_dir" "$restore_dir"

          curl --fail --silent --show-error --location --retry 3 \
            --output "$tools/supabase.tar.gz" \
            "https://github.com/supabase/cli/releases/download/v3.1.0/supabase_3.1.0_linux_amd64.tar.gz"
          echo "dbe9fd66771337fc198727da86b9d3551302f87a7091cd8781be2a4cd0c8ac4d  $tools/supabase.tar.gz" | sha256sum --check --status
          tar -xzf "$tools/supabase.tar.gz" -C "$tools"

          printf '%s\n' '-- dummy role fixture' > "$dump_dir/roles.sql"
          printf '%s\n' 'CREATE TABLE public.orders (id integer PRIMARY KEY, label text NOT NULL);' > "$dump_dir/schema.sql"
          printf 'COPY public.orders (id, label) FROM stdin;\n1\tfixture\n\\.\n' > "$dump_dir/data.sql"
          printf '%s\n' 'CREATE SCHEMA IF NOT EXISTS supabase_migrations;' 'CREATE TABLE IF NOT EXISTS supabase_migrations.schema_migrations (version text);' > "$dump_dir/migration-schema.sql"
          printf '%s\n' 'COPY supabase_migrations.schema_migrations (version) FROM stdin;' 'fixture-version' '\.' > "$dump_dir/migration-data.sql"
          (cd "$dump_dir" && sha256sum -- *.sql > SHA256SUMS && sha256sum --check --status SHA256SUMS)

          if ! (cd "$restore_dir" && "$tools/supabase" init >/dev/null && "$tools/supabase" start \
            --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor) > "$start_log" 2>&1; then
            echo "::error::Dummy local Supabase stack could not start."
            exit 1
          fi
          container="$(docker ps --format '{{.ID}} {{.Names}}' | awk '$2 ~ /^supabase_db_/ { print $1; exit }')"
          test -n "$container" || { echo "::error::Dummy local Postgres container was not found."; exit 1; }
          docker exec "$container" createdb -U supabase_admin --maintenance-db=template1 dummy_restore_test
          docker exec -i "$container" psql --single-transaction --set ON_ERROR_STOP=1 -U postgres -d dummy_restore_test < "$dump_dir/schema.sql"
          docker exec -i "$container" psql --single-transaction --set ON_ERROR_STOP=1 -U postgres -d dummy_restore_test < "$dump_dir/data.sql"
          docker exec -i "$container" psql --single-transaction --set ON_ERROR_STOP=1 -U postgres -d dummy_restore_test < "$dump_dir/migration-schema.sql"
          docker exec -i "$container" psql --single-transaction --set ON_ERROR_STOP=1 -U postgres -d dummy_restore_test < "$dump_dir/migration-data.sql"
          grep -Eq '^COPY supabase_migrations\.schema_migrations ' "$dump_dir/migration-data.sql"
          docker exec "$container" psql --set ON_ERROR_STOP=1 -U postgres -d dummy_restore_test --command "DO \$\$ BEGIN IF (SELECT count(*) FROM supabase_migrations.schema_migrations) = 0 THEN RAISE EXCEPTION 'migration history is empty'; END IF; IF to_regclass('public.orders') IS NULL THEN RAISE EXCEPTION 'orders is absent'; END IF; IF (SELECT count(*) FROM public.orders) <> 1 THEN RAISE EXCEPTION 'orders row count mismatch'; END IF; END \$\$;" >/dev/null

          set +e
          docker exec "$container" psql -v ON_ERROR_STOP=0 -v VERBOSITY=verbose -U postgres -d postgres \
            --command 'SET ROLE anon; CREATE ROLE fixture_privilege_probe;' > "$privilege_log" 2>&1
          privilege_exit=$?
          set -e
          if (( privilege_exit == 0 )); then
            echo "::error::Local privilege fixture unexpectedly completed without a PostgreSQL error."
            exit 1
          fi
          grep -Eq '^ERROR:[[:space:]]+42501:' "$privilege_log" || {
            echo "::error::Local privilege fixture category=unexpected sqlstate=unavailable"
            exit 1
          }
          echo "Local privilege fixture category=insufficient_privilege sqlstate=42501"
          echo "Dummy restore validation passed."

  backup:
    name: Encrypted database backup
    needs: tooling-smoke-test
    if: inputs.validate_only == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
      NO_COLOR: "1"
    steps:
      - name: Validate required configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "$SUPABASE_DB_URL" || -z "$BACKUP_AGE_RECIPIENT" ]]; then
            echo "::error::Configure SUPABASE_DB_URL and BACKUP_AGE_RECIPIENT before dispatching this workflow."
            exit 1
          fi
          if [[ ! "$SUPABASE_DB_URL" =~ ^postgres(ql)?:// ]]; then
            echo "::error::SUPABASE_DB_URL must be a PostgreSQL URL."
            exit 1
          fi
          if [[ ! "$BACKUP_AGE_RECIPIENT" =~ ^age1[ac-hj-np-z02-9]+$ ]]; then
            echo "::error::BACKUP_AGE_RECIPIENT must be an age X25519 public recipient."
            exit 1
          fi
          echo "Required configuration is present."

      - name: Install pinned tools
        shell: bash
        run: |
          set -Eeuo pipefail
          tools="$RUNNER_TEMP/perfun-backup-tools"
          mkdir -p "$tools"

          supabase_version="3.1.0"
          supabase_sha256="dbe9fd66771337fc198727da86b9d3551302f87a7091cd8781be2a4cd0c8ac4d"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$tools/supabase.tar.gz" \
            "https://github.com/supabase/cli/releases/download/v${supabase_version}/supabase_${supabase_version}_linux_amd64.tar.gz"
          echo "${supabase_sha256}  $tools/supabase.tar.gz" | sha256sum --check --status
          tar -xzf "$tools/supabase.tar.gz" -C "$tools"
          install -m 0755 "$tools/supabase" "$tools/supabase-bin"

          age_version="1.3.2"
          age_sha256="cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$tools/age.tar.gz" \
            "https://github.com/FiloSottile/age/releases/download/v${age_version}/age-v${age_version}-linux-amd64.tar.gz"
          echo "${age_sha256}  $tools/age.tar.gz" | sha256sum --check --status
          tar -xzf "$tools/age.tar.gz" -C "$tools"
          install -m 0755 "$tools/age/age" "$tools/age-bin"

          mkdir -p "$tools/path"
          mv "$tools/supabase-bin" "$tools/path/supabase"
          mv "$tools/age-bin" "$tools/path/age"
          echo "$tools/path" >> "$GITHUB_PATH"
          "$tools/path/supabase" --version
          "$tools/path/age" --version

      - name: Dump production database read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          backup_dir="$RUNNER_TEMP/perfun-db-backup"
          dump_log="$RUNNER_TEMP/perfun-db-dump.log"
          mkdir -p "$backup_dir"
          cleanup_plaintext() {
            rm -rf -- "$backup_dir" "$dump_log"
          }
          trap cleanup_plaintext EXIT

          dump() {
            # Do not expose a CLI diagnostic because it could include a remote target.
            # The temporary diagnostic file is deleted by the EXIT trap.
            if ! supabase db dump "$@" >"$dump_log" 2>&1; then
              echo "::error::A database dump command failed; no diagnostic output is published."
              return 1
            fi
          }

          # db dump invokes pg_dump only. There is deliberately no db push, db reset,
          # migration, SQL query, or other remote write command in this workflow.
          dump --remote="$SUPABASE_DB_URL" --role-only --file "$backup_dir/roles.sql"
          dump --remote="$SUPABASE_DB_URL" --file "$backup_dir/schema.sql"
          dump --remote="$SUPABASE_DB_URL" --data-only --use-copy --file "$backup_dir/data.sql"
          dump --remote="$SUPABASE_DB_URL" --schema supabase_migrations --file "$backup_dir/migration-schema.sql"
          dump --remote="$SUPABASE_DB_URL" --schema supabase_migrations --data-only --use-copy --file "$backup_dir/migration-data.sql"

          for dump in "$backup_dir"/*.sql; do
            test -s "$dump" || { echo "::error::A required dump is empty."; exit 1; }
          done
          (cd "$backup_dir" && sha256sum -- *.sql > SHA256SUMS)
          echo "Plaintext dump set completed and checksummed."

          # Keep the folder for the next, isolated local restore-test step. Its EXIT trap
          # ensures it is deleted if this step fails before encryption.
          rm -f -- "$dump_log"
          trap - EXIT

      - name: Encrypt backup and record ciphertext checksum
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          backup_dir="$RUNNER_TEMP/perfun-db-backup"
          archive="$RUNNER_TEMP/perfun-backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz.age"
          encryption_succeeded=0
          cleanup_failed_encryption() {
            if (( ! encryption_succeeded )); then
              rm -rf -- "$backup_dir" "$archive" "${archive}.sha256"
            fi
          }
          trap cleanup_failed_encryption EXIT

          (cd "$backup_dir" && sha256sum --check --status SHA256SUMS)
          tar -C "$backup_dir" -czf - . | age --encrypt --recipient "$BACKUP_AGE_RECIPIENT" --output "$archive"
          test -s "$archive"
          sha256sum "$archive" > "${archive}.sha256"
          echo "BACKUP_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "BACKUP_CHECKSUM=${archive}.sha256" >> "$GITHUB_ENV"
          encryption_succeeded=1
          echo "Encrypted archive and ciphertext checksum created."

      - name: Upload encrypted artifact only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perfun-supabase-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.BACKUP_ARCHIVE }}
            ${{ env.BACKUP_CHECKSUM }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Record encrypted artifact upload
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "BACKUP_ARTIFACT_UPLOADED=true" >> "$GITHUB_ENV"
          echo "Encrypted backup artifact uploaded; isolated restore verification will now run."

      - name: Restore-test dump in an isolated local Supabase stack
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          backup_dir="$RUNNER_TEMP/perfun-db-backup"
          restore_dir="$RUNNER_TEMP/perfun-db-restore-test"
          restore_start_log="$RUNNER_TEMP/perfun-db-restore-start.log"
          role_log="$RUNNER_TEMP/perfun-db-restore-roles.log"
          local_platform_roles="$RUNNER_TEMP/perfun-db-local-platform-roles"
          local_roles_log="$RUNNER_TEMP/perfun-db-local-platform-roles.log"
          role_parser_test_dir="$RUNNER_TEMP/perfun-db-role-parser-test"
          data_manifest="$RUNNER_TEMP/perfun-db-restore-data-counts"
          template_connections_blocked=0
          restore_verified=0
          mkdir -p "$restore_dir"
          cleanup() {
            if (( template_connections_blocked )); then
              docker exec "$container" psql --set ON_ERROR_STOP=1 -U supabase_admin -d template1 \
                --command 'ALTER DATABASE postgres WITH ALLOW_CONNECTIONS true;' >/dev/null 2>&1 || true
            fi
            (cd "$restore_dir" && supabase stop --no-backup) >/dev/null 2>&1 || true
            rm -rf -- "$restore_dir" "$backup_dir" "$restore_start_log" "$role_log" "$local_platform_roles" "$local_roles_log" "$role_parser_test_dir" "$data_manifest"
            if (( restore_verified )); then
              echo "Encrypted backup artifact uploaded; isolated restore verified."
            else
              echo "::error::Encrypted backup artifact uploaded; isolated restore has not been verified."
            fi
          }
          trap cleanup EXIT

          validate_role_restore_log() {
            local log_file="$1"
            local expected_roles_file="$2"
            local line sqlstate role category
            local validation_failed=0

            while IFS= read -r line || [[ -n "$line" ]]; do
              [[ "$line" == ERROR:* ]] || continue

              # A duplicate is tolerated only when its exact diagnostic identifies a
              # platform role that the fresh local Supabase target already contains.
              # Do not print the raw line or the role name: either may be sensitive.
              if [[ "$line" =~ ^ERROR:[[:space:]]+42710:[[:space:]]+role[[:space:]]+\"([^\"]+)\"[[:space:]]+already[[:space:]]+exists$ ]]; then
                role="${BASH_REMATCH[1]}"
                if grep -Fxq -- "$role" "$expected_roles_file"; then
                  echo "Role restore accepted category=expected_platform_role_duplicate sqlstate=42710"
                  continue
                fi
                echo "::error::Role restore category=unexpected_duplicate_object sqlstate=42710"
                validation_failed=1
                continue
              fi

              if [[ "$line" =~ ^ERROR:[[:space:]]+([0-9A-Z]{5}): ]]; then
                sqlstate="${BASH_REMATCH[1]}"
                case "$sqlstate" in
                  42501) category=insufficient_privilege ;;
                  0LP01) category=invalid_grantor ;;
                  42704) category=undefined_object ;;
                  22023) category=invalid_parameter_value ;;
                  42809) category=wrong_object_type ;;
                  42710) category=unexpected_duplicate_object ;;
                  *) category=incompatible_role_statement ;;
                esac
                echo "::error::Role restore category=$category sqlstate=$sqlstate"
              else
                echo "::error::Role restore category=unclassified sqlstate=unavailable"
              fi
              validation_failed=1
            done < "$log_file"

            (( validation_failed == 0 ))
          }

          (cd "$backup_dir" && sha256sum --check --status SHA256SUMS)
          # The database image contains the Supabase-managed schemas, extensions, and
          # roles needed by the restore. The remaining local development services are
          # not restore dependencies, so exclude them to avoid pulling a full stack.
          if ! (cd "$restore_dir" && supabase init >/dev/null && supabase start \
            --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor) > "$restore_start_log" 2>&1; then
            echo "::error::The isolated Supabase database container could not start."
            exit 1
          fi
          container="$(docker ps --format '{{.ID}} {{.Names}}' | awk '$2 ~ /^supabase_db_/ { print $1; exit }')"
          test -n "$container" || { echo "::error::Local Supabase Postgres container was not found."; exit 1; }

          # The target clones the initialized local Supabase database, preserving its
          # managed schemas, extensions, and built-in roles while keeping application
          # data isolated in a new database on the ephemeral runner. PostgreSQL refuses
          # a template with active sessions, so block new local-only connections and
          # terminate current sessions before cloning from a separate maintenance DB.
          docker exec "$container" psql --set ON_ERROR_STOP=1 -U supabase_admin -d template1 \
            --command 'ALTER DATABASE postgres WITH ALLOW_CONNECTIONS false;' >/dev/null
          template_connections_blocked=1
          docker exec "$container" psql --set ON_ERROR_STOP=1 -U supabase_admin -d template1 \
            --command "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'postgres' AND pid <> pg_backend_pid();" >/dev/null
          docker exec "$container" createdb -U supabase_admin --maintenance-db=template1 -T postgres backup_restore_test
          docker exec "$container" psql --set ON_ERROR_STOP=1 -U supabase_admin -d template1 \
            --command 'ALTER DATABASE postgres WITH ALLOW_CONNECTIONS true;' >/dev/null
          template_connections_blocked=0

          # Prove the strict parser before applying a real role dump. Test output is
          # private to the runner and is removed by cleanup.
          mkdir -p "$role_parser_test_dir"
          printf '%s\n' postgres > "$role_parser_test_dir/expected-roles"
          printf '%s\n' 'ERROR:  42710: role "postgres" already exists' > "$role_parser_test_dir/expected-duplicate.log"
          validate_role_restore_log "$role_parser_test_dir/expected-duplicate.log" "$role_parser_test_dir/expected-roles" > "$role_parser_test_dir/expected-duplicate.out" 2>&1 || {
            echo "::error::Role restore parser rejected an expected platform role duplicate."
            exit 1
          }
          printf '%s\n' 'ERROR:  42710: role "postgres" already exists' 'ERROR: diagnostic without SQLSTATE' > "$role_parser_test_dir/mixed-unclassified.log"
          if validate_role_restore_log "$role_parser_test_dir/mixed-unclassified.log" "$role_parser_test_dir/expected-roles" > "$role_parser_test_dir/mixed-unclassified.out" 2>&1; then
            echo "::error::Role restore parser accepted a mixed log with an unclassified error."
            exit 1
          fi
          printf '%s\n' 'ERROR:  42710: extension "uuid-ossp" already exists' > "$role_parser_test_dir/non-role-duplicate.log"
          if validate_role_restore_log "$role_parser_test_dir/non-role-duplicate.log" "$role_parser_test_dir/expected-roles" > "$role_parser_test_dir/non-role-duplicate.out" 2>&1; then
            echo "::error::Role restore parser accepted a non-role duplicate object."
            exit 1
          fi
          set +e
          docker exec "$container" psql -v ON_ERROR_STOP=0 -v VERBOSITY=verbose -U postgres -d postgres \
            --command 'SET ROLE anon; CREATE ROLE fixture_privilege_probe;' > "$role_parser_test_dir/privilege.log" 2>&1
          privilege_exit=$?
          set -e
          if (( privilege_exit == 0 )); then
            echo "::error::Local privilege diagnostic fixture unexpectedly completed without a PostgreSQL error."
            exit 1
          fi
          grep -Eq '^ERROR:[[:space:]]+42501:' "$role_parser_test_dir/privilege.log" || {
            echo "::error::Local privilege diagnostic fixture did not reproduce SQLSTATE 42501."
            exit 1
          }
          if validate_role_restore_log "$role_parser_test_dir/privilege.log" "$role_parser_test_dir/expected-roles" > "$role_parser_test_dir/privilege.out" 2>&1; then
            echo "::error::Role restore parser accepted a SQLSTATE 42501 privilege error."
            exit 1
          fi
          echo "Role restore parser synthetic tests passed."

          # Roles are cluster-wide. Accept only an exact duplicate-role diagnostic for
          # a known platform role that exists in the fresh local Supabase target. Any
          # other error fails. The raw role dump remains unchanged in the encrypted
          # artifact for an actual recovery procedure.
          if ! docker exec "$container" psql -At --set ON_ERROR_STOP=1 -U postgres -d postgres \
            --command "SELECT rolname FROM pg_roles WHERE rolname = ANY (ARRAY['anon', 'authenticated', 'authenticator', 'dashboard_user', 'pgbouncer', 'postgres', 'service_role', 'supabase_admin', 'supabase_auth_admin', 'supabase_functions_admin', 'supabase_net_admin', 'supabase_read_only_user', 'supabase_realtime_admin', 'supabase_replication_admin', 'supabase_storage_admin']) ORDER BY rolname;" > "$local_platform_roles" 2> "$local_roles_log"; then
            echo "::error::Could not inventory local Supabase platform roles."
            exit 1
          fi
          if ! docker exec -i "$container" psql -v ON_ERROR_STOP=0 -v VERBOSITY=verbose -U postgres -d postgres < "$backup_dir/roles.sql" > "$role_log" 2>&1; then
            echo "::error::Role restore command could not run."
            exit 1
          fi
          if ! validate_role_restore_log "$role_log" "$local_platform_roles"; then
            exit 1
          fi
          docker exec -i "$container" psql --single-transaction --set ON_ERROR_STOP=1 -U postgres -d backup_restore_test < "$backup_dir/schema.sql"
          docker exec -i "$container" psql --single-transaction --set ON_ERROR_STOP=1 -U postgres -d backup_restore_test \
            --command 'SET session_replication_role = replica' --file /dev/stdin < "$backup_dir/data.sql"
          docker exec -i "$container" psql --single-transaction --set ON_ERROR_STOP=1 -U postgres -d backup_restore_test < "$backup_dir/migration-schema.sql"
          docker exec -i "$container" psql --single-transaction --set ON_ERROR_STOP=1 -U postgres -d backup_restore_test < "$backup_dir/migration-data.sql"

          # Prove migration history is rows, not an empty/comment-only dump.
          grep -Eq '^COPY supabase_migrations\.schema_migrations ' "$backup_dir/migration-data.sql" || {
            echo "::error::Migration history dump does not contain COPY data for schema_migrations."
            exit 1
          }
          docker exec "$container" psql --set ON_ERROR_STOP=1 -U postgres -d backup_restore_test \
            --command "DO \$\$ BEGIN IF (SELECT count(*) FROM supabase_migrations.schema_migrations) = 0 THEN RAISE EXCEPTION 'migration history is empty'; END IF; END \$\$;" >/dev/null

          # Require the application's core orders table and compare every unquoted,
          # non-empty COPY table's row count with the restored data.
          docker exec "$container" psql --set ON_ERROR_STOP=1 -U postgres -d backup_restore_test \
            --command "DO \$\$ BEGIN IF to_regclass('public.orders') IS NULL THEN RAISE EXCEPTION 'public.orders is absent'; END IF; END \$\$;" >/dev/null
          awk '
            /^COPY [A-Za-z_][A-Za-z0-9_]*\.[A-Za-z_][A-Za-z0-9_]* / { table=$2; rows=0; copying=1; next }
            copying && $0 == "\\." { if (rows > 0) print table, rows; copying=0; next }
            copying { rows++ }
          ' "$backup_dir/data.sql" > "$data_manifest"
          while read -r table expected; do
            actual="$(docker exec "$container" psql --tuples-only --no-align --set ON_ERROR_STOP=1 -U postgres -d backup_restore_test --command "SELECT count(*) FROM $table;")"
            actual="${actual//[[:space:]]/}"
            test "$actual" = "$expected" || { echo "::error::Restored row count does not match the data dump."; exit 1; }
          done < "$data_manifest"
          restore_verified=1
          echo "Isolated restore test passed."

      - name: Remove local backup material
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- "$RUNNER_TEMP/perfun-db-backup" "$RUNNER_TEMP/perfun-db-restore-test" "$RUNNER_TEMP/perfun-db-dump.log" "$RUNNER_TEMP/perfun-db-restore-start.log" "$RUNNER_TEMP/perfun-db-restore-roles.log" "$RUNNER_TEMP/perfun-db-local-platform-roles" "$RUNNER_TEMP/perfun-db-local-platform-roles.log" "$RUNNER_TEMP/perfun-db-role-parser-test" "$RUNNER_TEMP/perfun-db-restore-data-counts"
          find "$RUNNER_TEMP" -maxdepth 1 -type f -name 'perfun-backup-*.tar.gz.age*' -delete
