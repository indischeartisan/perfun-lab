name: Phase 2 local validation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      shipping_address_e2e:
        description: Run the isolated shipping-address browser integration job
        required: false
        default: false
        type: boolean
  push:
    branches:
      - codex/admin-testing-mode
      - codex/test-order-shipping-ui

permissions:
  contents: read

jobs:
  validate:
    name: Build and local database tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          # Node 24 supports the built-in TypeScript stripping used by test:payments.
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'

      - name: Build pinned Supabase CLI from official source
        shell: bash
        run: |
          set -Eeuo pipefail
          export GOBIN="$RUNNER_TEMP/supabase-cli-bin"
          export GOPROXY=https://proxy.golang.org
          cli_source="$RUNNER_TEMP/supabase-cli-source"
          mkdir -p "$GOBIN"
          git init --quiet "$cli_source"
          git -C "$cli_source" remote add origin https://github.com/supabase/cli.git
          git -C "$cli_source" fetch --depth=1 origin bce705147ae90b9bddd6dfc24986744ced1d97d4
          git -C "$cli_source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$cli_source" rev-parse HEAD)" = bce705147ae90b9bddd6dfc24986744ced1d97d4
          (cd "$cli_source" && go build -trimpath -o "$GOBIN/supabase" .)
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Verify local CI prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          # The source build does not carry the release-time --version ldflag.
          # Its immutable tag commit was checked before compilation above.
          supabase --help >/dev/null
          docker info

      - name: TypeScript check
        run: npm exec tsc -- -b

      - name: ESLint
        run: npm run lint

      - name: Payment unit tests
        run: npm run test:payments

      - name: Shipping provider unit tests
        run: npm run test:shipping

      - name: Shipping destination normalization tests
        run: node --experimental-strip-types --test tests/shipping-destination-normalization.test.mjs tests/shipping-search-state.test.mjs tests/shipping-address-state.test.mjs

      - name: Shipping checkout unit tests
        run: npm run test:shipping-checkout

      - name: Client state regression tests
        run: npm run test:client-state

      - name: Production build
        run: npm run build

      - name: Apply local migrations and run SQL regression tests
        shell: bash
        run: |
          set -Eeuo pipefail

          # This starts Docker containers on the ephemeral GitHub runner only.
          # No project is linked and no remote Supabase command is invoked.
          cleanup() {
            supabase stop --no-backup || true
          }
          trap cleanup EXIT

          # Keep the local stack's generated credentials out of the Actions log.
          supabase start >"$RUNNER_TEMP/supabase-start.log" 2>&1
          supabase db reset --local --yes
          supabase migration list --local

          db_container="$(docker ps --format '{{.ID}} {{.Names}}' | awk '$2 ~ /^supabase_db_/ { print $1; exit }')"
          if [[ -z "$db_container" ]]; then
            echo "::error::Local Supabase Postgres container was not found."
            exit 1
          fi

          sql_tests=(
            supabase/tests/ownership.sql
            supabase/tests/orders.sql
            supabase/tests/direct_formulas.sql
            supabase/tests/payments.sql
            supabase/tests/production.sql
            supabase/tests/shipping.sql
            supabase/tests/packing.sql
            supabase/tests/shipment_tracking_correction.sql
            supabase/tests/shipment_delivery_confirmation.sql
            supabase/tests/payouts.sql
            supabase/tests/shipping_foundation.sql
            supabase/tests/shipping_checkout.sql
            supabase/tests/shipping_address_atomic.sql
            supabase/tests/shipping_address_consistency.sql
            supabase/tests/checkout_shipping_readiness.sql
            supabase/tests/admin.sql
            supabase/tests/admin_order_recipe_snapshot.sql
            supabase/tests/vendor_assignment.sql
            supabase/tests/vendor_order_projection.sql
            supabase/tests/admin_testing_preflight.sql
            supabase/tests/admin_test_runs.sql
            supabase/tests/test_run_shipping_address.sql
          )
          failed_tests=()

          for sql_test in "${sql_tests[@]}"; do
            if [[ ! -f "$sql_test" ]]; then
              echo "::error file=$sql_test::Required SQL test file is missing."
              failed_tests+=("$sql_test (missing)")
              continue
            fi

            echo "::group::SQL test: $sql_test"
            # psql runs inside the database container, so it cannot resolve a
            # host-side \ir include. Inline the transaction-scoped checkout
            # fixture at its marker before sending the script over stdin.
            if ! while IFS= read -r line || [[ -n "$line" ]]; do
              if [[ "$line" == '\ir checkout_test_helpers.sql' ]]; then
                cat supabase/tests/checkout_test_helpers.sql
              else
                printf '%s\n' "$line"
              fi
            done < "$sql_test" | docker exec -i "$db_container" psql \
              -v ON_ERROR_STOP=1 \
              -U postgres \
              -d postgres; then
              failed_tests+=("$sql_test")
            fi
            echo "::endgroup::"
          done

          if (( ${#failed_tests[@]} > 0 )); then
            echo "::error::One or more local SQL tests failed:"
            printf ' - %s\n' "${failed_tests[@]}"
            exit 1
          fi

          echo '::group::Vendor two-session concurrency regression'
          docker exec -i "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/vendor_concurrency_setup.sql
          run_job() {
            docker exec -i "$db_container" psql -v ON_ERROR_STOP=1 -v job_item="$1" -v action="$2" -U postgres -d postgres < supabase/tests/vendor_concurrency_action.sql
          }
          item_one=d3000000-0000-4000-8000-000000000001
          item_two=d3000000-0000-4000-8000-000000000002
          run_job "$item_one" start & first=$!
          run_job "$item_one" start & second=$!
          wait "$first"
          wait "$second"
          run_job "$item_two" start
          run_job "$item_one" complete & first=$!
          run_job "$item_two" complete & second=$!
          wait "$first"
          wait "$second"
          docker exec -i "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/vendor_concurrency_check.sql
          echo '::endgroup::'

          echo '::group::TEST run two-session concurrency regression'
          docker exec -i "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/test_run_concurrency_setup.sql
          docker exec -i "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/test_run_concurrency_action.sql & first=$!
          docker exec -i "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/test_run_concurrency_action.sql & second=$!
          wait "$first"
          wait "$second"
          docker exec -i "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/test_run_concurrency_check.sql
          echo '::endgroup::'

  shipping-address-e2e:
    name: Isolated shipping-address browser integration
    if: github.event_name == 'workflow_dispatch' && inputs.shipping_address_e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      E2E_EMAIL: customer-e2e@example.test
      E2E_APP_URL: http://127.0.0.1:4174/shipping-address-e2e.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
      - name: Build pinned Supabase CLI from official source
        shell: bash
        run: |
          set -Eeuo pipefail
          export GOBIN="$RUNNER_TEMP/supabase-cli-bin"
          export GOPROXY=https://proxy.golang.org
          cli_source="$RUNNER_TEMP/supabase-cli-source"
          mkdir -p "$GOBIN"
          git init --quiet "$cli_source"
          git -C "$cli_source" remote add origin https://github.com/supabase/cli.git
          git -C "$cli_source" fetch --depth=1 origin bce705147ae90b9bddd6dfc24986744ced1d97d4
          git -C "$cli_source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$cli_source" rev-parse HEAD)" = bce705147ae90b9bddd6dfc24986744ced1d97d4
          (cd "$cli_source" && go build -trimpath -o "$GOBIN/supabase" .)
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Install application dependencies
        run: npm ci
      - name: Install disposable browser runner
        run: |
          npm install --no-save --ignore-scripts playwright@1.59.1
          npx playwright install --with-deps chromium
      - name: Exercise local Auth, Edge Functions, mock provider, and browser
        shell: bash
        run: |
          set -Eeuo pipefail
          E2E_PASSWORD="$(openssl rand -hex 24)"
          mock_provider_key="$(openssl rand -hex 24)"
          echo "::add-mask::$E2E_PASSWORD"
          echo "::add-mask::$mock_provider_key"
          cleanup() {
            [[ -n "${vite_pid:-}" ]] && kill "$vite_pid" 2>/dev/null || true
            [[ -n "${functions_pid:-}" ]] && kill "$functions_pid" 2>/dev/null || true
            docker rm -f rajaongkir-mock 2>/dev/null || true
            supabase stop --no-backup || true
          }
          trap cleanup EXIT

          # The stack is ephemeral, but its generated local credentials must
          # still not be emitted in an Actions log. Show only a redacted error
          # classification if Docker or the local stack cannot start.
          start_log="$RUNNER_TEMP/supabase-start.log"
          if ! supabase start >"$start_log" 2>&1; then
            echo '::error::Local Supabase stack failed to start (sanitized diagnostics follow).'
            { grep -Ei 'error|fail|unable|cannot|denied|timeout|pull|start' "$start_log" || true; } | tail -n 30 | sed -E 's/(sb_(publishable|secret)_[A-Za-z0-9_-]+)/[redacted]/g; s/(postgres(ql)?:\/\/)[^@[:space:]]+@/\1[redacted]@/g; s/(service_role|anon|api[_-]?key|secret)[=:][^[:space:]]+/\1=[redacted]/Ig'
            exit 1
          fi
          supabase db reset --local --yes
          eval "$(supabase status -o env)"
          db_container="$(docker ps --format '{{.ID}} {{.Names}}' | awk '$2 ~ /^supabase_db_/ { print $1; exit }')"
          network="$(docker network ls --format '{{.Name}}' | awk '/^supabase_network_/ { print; exit }')"
          test -n "$db_container" && test -n "$network"

          user_json="$RUNNER_TEMP/e2e-user.json"
          curl --fail --silent --show-error -X POST "$API_URL/auth/v1/admin/users" -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" -H 'Content-Type: application/json' --data "{\"email\":\"$E2E_EMAIL\",\"password\":\"$E2E_PASSWORD\",\"email_confirm\":true}" > "$user_json"
          customer_id="$(jq -r '.id' "$user_json")"
          test "$customer_id" != null && test -n "$customer_id"
          docker exec -i "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -v customer_id="$customer_id" < scripts/e2e/seed-shipping-address-e2e.sql

          docker run -d --rm --name rajaongkir-mock --network "$network" -v "$GITHUB_WORKSPACE/scripts/e2e/rajaongkir-mock.mjs:/app/mock.mjs:ro" node:24-alpine node /app/mock.mjs >/dev/null
          function_env="$RUNNER_TEMP/shipping-functions.env"
          cat > "$function_env" <<EOF
          SUPABASE_URL=http://kong:8000
          SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          RAJAONGKIR_SHIPPING_COST_API_KEY=$mock_provider_key
          RAJAONGKIR_SHIPPING_COST_BASE_URL=http://rajaongkir-mock:8788/api/v1
          SHIPPING_ENVIRONMENT=integration-test
          SHIPPING_ALLOWED_ORIGINS=http://127.0.0.1:4174
          APP_URL=http://127.0.0.1:4174
          EOF
          supabase functions serve --env-file "$function_env" --network-id "$network" >"$RUNNER_TEMP/functions.log" 2>&1 & functions_pid=$!
          VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" VITE_E2E_CUSTOMER_EMAIL="$E2E_EMAIL" VITE_E2E_CUSTOMER_PASSWORD="$E2E_PASSWORD" npx vite --config vite.shipping-address-e2e.config.ts --host 127.0.0.1 --port 4174 >"$RUNNER_TEMP/vite.log" 2>&1 & vite_pid=$!
          for attempt in {1..30}; do curl --silent --fail "$E2E_APP_URL" >/dev/null && break; sleep 1; done
          curl --silent --fail "$E2E_APP_URL" >/dev/null
          E2E_RESULT_FILE="$RUNNER_TEMP/e2e-result.json" node scripts/e2e/shipping-address-browser.mjs

          # The browser fixture enables shipping to reach the local Functions.
          # Restore the baseline before replaying the existing OFF/ON checkout
          # regression, which deliberately verifies both feature states.
          docker exec -i "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "update private.shipping_feature_settings set enabled = false"

          # Keep psql's \ir helper local to the repository checkout. This avoids
          # depending on a container mount while replaying the established SQL
          # regressions against the same ephemeral Postgres instance.
          run_shipping_sql() {
            local test_file="$1"
            {
              while IFS= read -r line || [[ -n "$line" ]]; do
                if [[ "$line" == '\ir checkout_test_helpers.sql' ]]; then
                  cat supabase/tests/checkout_test_helpers.sql
                else
                  printf '%s\n' "$line"
                fi
              done < "$test_file"
            } | docker exec -i "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres
          }
          run_shipping_sql supabase/tests/shipping_address_consistency.sql
          run_shipping_sql supabase/tests/shipping_checkout.sql
          jq -e '.javaQuote and .finalQuote and .addressCards >= 2' "$RUNNER_TEMP/e2e-result.json" >/dev/null
