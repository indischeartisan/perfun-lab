project_id = "perfun-lab"

[functions.payments-create]
verify_jwt = true

[functions.payments-sync]
verify_jwt = true

# DOKU does not send a Supabase JWT. Handler verifies DOKU HMAC before any write.
[functions.payments-webhook]
verify_jwt = false

# Called only by the database-generated scheduler token; the handler performs
# its own token check before using the service role.
[functions.payments-expiry]
verify_jwt = false

[functions.shipping-destinations]
verify_jwt = true

[functions.shipping-quote]
verify_jwt = true
